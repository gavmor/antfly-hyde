pre-commit:
  parallel: true
  jobs:
    - name: ruff
      glob: "*.py"
      run: uv run ruff check --force-exclude {staged_files}
    - name: cyclomatic-complexity
      glob: "*.py"
      run: uv run ruff check --select C901 --force-exclude {staged_files}
    - name: cognitive-complexity
      glob: "*.py"
      run: uv run complexipy {staged_files}
    - name: ruff-format
      glob: "*.py"
      run: uv run ruff format --check --force-exclude {staged_files}
    - name: ty
      glob: "*.py"
      run: uv run ty check
    - name: jscpd
      glob: "*.py"
      run: uv run jscpd app ebooks reverse --pattern "**/*.py"
